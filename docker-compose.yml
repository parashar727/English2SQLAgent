services:
  postgres_db:
    image: postgres:17-alpine
    container_name: chinook_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "0727"
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d  # automatically runs the .sql script on initialization
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: